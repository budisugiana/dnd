<title>Akademi Learning Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ============================================================
   AKADEMI LEARNING WORKSPACE — design tokens
   Palette "Pine & Brass": pine-green brand on a cool paper
   ground, brass reserved for readiness/achievement, chart
   series drawn from the validated blue ramp + status palette.
   ============================================================ */
  :root {
    color-scheme: light;
    --ground: #EFF3F4;
    --surface: #ffffff;
    --surface-2: #E7F3F4;
    --surface-3: #D6E0E2;
    --sidebar: #00323A;
    --sidebar-2: #00282E;
    --sidebar-ink: #E7F3F4;
    --sidebar-mut: #587178;
    --ink: #0E2429;
    --ink-2: #587178;
    --ink-3: #587178;
    --line: #D6E0E2;
    --line-2: #D6E0E2;
    --brand: #00636F;
    --brand-2: #00505A;
    --brand-soft: #E7F3F4;
    --brand-ink: #00323A;
    --brass: #DD4B12;
    --brass-soft: #FDE8E0;
    /* status (fixed, never themed) */
    --good: #15703F;
    --good-ink: #0C4426;
    --good-soft: #DFF0E5;
    --warning: #9A4708;
    --warn-ink: #5F2B04;
    --warn-soft: #FAEDD9;
    --serious: #DD4B12;
    --serious-ink: #8A2D0A;
    --serious-soft: #FCE8E0;
    --critical: #B3261E;
    --crit-ink: #7A1711;
    --crit-soft: #F9E0DF;
    --info-soft: #E7F3F4;
    --info-ink: #00323A;
    /* chart */
    --c-surface: #ffffff;
    --c-grid: #D6E0E2;
    --c-axis: #587178;
    --c-muted: #587178;
    --seq-100: #E7F3F4;
    --seq-250: #8CC4CD;
    --seq-350: #008C9B;
    --seq-450: #008C9B;
    --seq-550: #00636F;
    --seq-650: #00323A;
    --shadow-1: 0 1px 2px rgba(16, 24, 21, .06), 0 1px 1px rgba(16, 24, 21, .04);
    --shadow-2: 0 10px 30px -12px rgba(16, 24, 21, .22), 0 2px 6px rgba(16, 24, 21, .06);
    --r-sm: 5px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-xl: 18px;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Archivo", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0b110f;
    --surface: #131b18;
    --surface-2: #182220;
    --surface-3: #1f2b27;
    --sidebar: #0a1210;
    --sidebar-2: #131f1b;
    --sidebar-ink: #c3d6cf;
    --sidebar-mut: #6d857c;
    --ink: #e9f0ec;
    --ink-2: #9fb3aa;
    --ink-3: #7a8c85;
    --line: #25332e;
    --line-2: #1c2724;
    --brand: #2fa78d;
    --brand-2: #43bda2;
    --brand-soft: #12312a;
    --brand-ink: #7fd9c2;
    --brass: #d0a03f;
    --brass-soft: #322612;
    --good-ink: #6ede6e;
    --good-soft: #123012;
    --warn-ink: #f6ce74;
    --warn-soft: #322613;
    --serious-ink: #f3ad8e;
    --serious-soft: #33201a;
    --crit-ink: #f19292;
    --crit-soft: #331818;
    --info-soft: #14243a;
    --info-ink: #9ac4f5;
    --c-surface: #131b18;
    --c-grid: #22302b;
    --c-axis: #2e3f39;
    --c-muted: #8fa39b;
    --seq-100: #123055;
    --seq-250: #184f95;
    --seq-350: #256abf;
    --seq-450: #3987e5;
    --seq-550: #6da7ec;
    --seq-650: #9ec5f4;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 12px 34px -14px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .3);
  }

  * {
    box-sizing: border-box;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1,
  h2,
  h3,
  h4,
  h5 {
    font-family: var(--display);
    margin: 0;
    font-weight: 600;
    letter-spacing: -.012em;
    text-wrap: balance;
    color: var(--ink);
  }

  p {
    margin: 0;
  }

  a {
    color: var(--brand);
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
    border-radius: 3px;
  }

  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }

  ::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 8px;
    border: 3px solid transparent;
    background-clip: content-box;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--ink-3);
    background-clip: content-box;
    border: 3px solid transparent;
  }

  /* ---------- app shell ---------- */
  .app {
    display: grid;
    grid-template-columns: 250px 1fr;
    min-height: 100vh;
  }

  .sidebar {
    background: var(--sidebar);
    color: var(--sidebar-ink);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
  }

  .brandmark {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 18px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, .07);
  }

  .brandmark .glyph {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: linear-gradient(160deg, var(--brand) 0%, #0a4a3d 100%);
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-weight: 700;
    color: #fff;
    font-size: 15px;
    flex: none;
  }

  .brandmark .wordmark {
    font-family: var(--display);
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: -.01em;
    color: #fff;
    line-height: 1.15;
  }

  .brandmark .sub {
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--sidebar-mut);
  }

  .navscroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px 20px;
  }

  .navgroup {
    margin-top: 14px;
  }

  .navgroup:first-child {
    margin-top: 2px;
  }

  .navlabel {
    font-size: 10px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--sidebar-mut);
    padding: 6px 10px;
    font-weight: 600;
  }

  .navitem {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border-radius: var(--r-md);
    background: none;
    border: 0;
    color: var(--sidebar-ink);
    cursor: pointer;
    font-size: 13.5px;
    position: relative;
  }

  .navitem:hover {
    background: var(--sidebar-2);
  }

  .navitem.active {
    background: var(--sidebar-2);
    color: #fff;
    font-weight: 500;
  }

  .navitem.active::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--brand-2);
  }

  .navitem .ico {
    width: 16px;
    height: 16px;
    flex: none;
    opacity: .85;
  }

  .navitem.sub {
    padding-left: 34px;
    font-size: 13px;
    color: var(--sidebar-mut);
  }

  .navitem.sub.active {
    color: #fff;
  }

  .navitem .tag {
    margin-left: auto;
    font-size: 10.5px;
    font-family: var(--mono);
    background: rgba(255, 255, 255, .1);
    padding: 1px 6px;
    border-radius: 20px;
  }

  .navitem .tag.alert {
    background: var(--critical);
    color: #fff;
  }

  .sidefoot {
    padding: 12px;
    border-top: 1px solid rgba(255, 255, 255, .07);
  }

  .userchip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: var(--r-md);
    background: var(--sidebar-2);
  }

  .userchip .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 600;
    flex: none;
    font-family: var(--display);
  }

  .userchip .nm {
    font-size: 12.5px;
    color: #fff;
    font-weight: 500;
    line-height: 1.2;
  }

  .userchip .rl {
    font-size: 10.5px;
    color: var(--sidebar-mut);
    text-transform: uppercase;
    letter-spacing: .07em;
  }

  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 56px;
  }

  .crumb {
    font-size: 12px;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .crumb b {
    color: var(--ink);
    font-weight: 500;
    font-size: 13px;
  }

  .topbar .spacer {
    flex: 1;
  }

  .content {
    padding: 22px 24px 60px;
    max-width: 1480px;
    width: 100%;
  }

  .pagehead {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .pagehead h1 {
    font-size: 22px;
    letter-spacing: -.02em;
  }

  .pagehead .desc {
    color: var(--ink-2);
    font-size: 13.5px;
    margin-top: 3px;
    max-width: 68ch;
  }

  .pagehead .actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ---------- primitives ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-1);
  }

  .card-h {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-2);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-h h3 {
    font-size: 14px;
    font-weight: 600;
  }

  .card-h .sub {
    font-size: 12px;
    color: var(--ink-3);
  }

  .card-h .right {
    margin-left: auto;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .card-b {
    padding: 16px;
  }

  .card-b.tight {
    padding: 12px;
  }

  .card-b.flush {
    padding: 0;
  }

  .grid {
    display: grid;
    gap: 14px;
  }

  .g2 {
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  }

  .g3 {
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  }

  .g4 {
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  }

  .g5 {
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }

  .gsplit {
    grid-template-columns: var(--cols, minmax(0, 1fr) minmax(0, 1fr));
  }

  @media (max-width: 1000px) {
    .gsplit {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .muted {
    color: var(--ink-2);
  }

  .dim {
    color: var(--ink-3);
  }

  .mono {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .eyebrow {
    font-size: 10.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  .num {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: -.02em;
  }

  .scroll-x {
    overflow-x: auto;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: var(--r-md);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s, border-color .12s, transform .06s;
  }

  .btn:hover {
    background: var(--surface-2);
    border-color: var(--ink-3);
  }

  .btn:active {
    transform: translateY(1px);
  }

  .btn.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  .btn.primary:hover {
    background: var(--brand-2);
    border-color: var(--brand-2);
  }

  .btn.ghost {
    border-color: transparent;
    background: transparent;
  }

  .btn.ghost:hover {
    background: var(--surface-3);
  }

  .btn.danger {
    color: var(--crit-ink);
    border-color: color-mix(in srgb, var(--critical) 35%, transparent);
  }

  .btn.danger:hover {
    background: var(--crit-soft);
  }

  .btn.sm {
    padding: 5px 10px;
    font-size: 12px;
    border-radius: var(--r-sm);
  }

  .btn.xs {
    padding: 3px 8px;
    font-size: 11.5px;
    border-radius: var(--r-sm);
  }

  .btn.block {
    width: 100%;
    justify-content: center;
  }

  .btn:disabled {
    opacity: .45;
    cursor: not-allowed;
  }

  .btn .ico {
    width: 15px;
    height: 15px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 500;
    border: 1px solid transparent;
    white-space: nowrap;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }

  .badge.neutral {
    background: var(--surface-3);
    color: var(--ink-2);
  }

  .badge.good {
    background: var(--good-soft);
    color: var(--good-ink);
  }

  .badge.warn {
    background: var(--warn-soft);
    color: var(--warn-ink);
  }

  .badge.serious {
    background: var(--serious-soft);
    color: var(--serious-ink);
  }

  .badge.crit {
    background: var(--crit-soft);
    color: var(--crit-ink);
  }

  .badge.info {
    background: var(--info-soft);
    color: var(--info-ink);
  }

  .badge.brand {
    background: var(--brand-soft);
    color: var(--brand-ink);
  }

  .badge.brass {
    background: var(--brass-soft);
    color: var(--brass);
  }

  .badge.lg {
    padding: 4px 11px;
    font-size: 12.5px;
  }

  .progress {
    height: 7px;
    background: var(--surface-3);
    border-radius: 20px;
    overflow: hidden;
  }

  .progress>i {
    display: block;
    height: 100%;
    border-radius: 20px;
    background: var(--brand);
    transition: width .4s cubic-bezier(.2, .7, .3, 1);
  }

  .progress.slim {
    height: 5px;
  }

  .progress>i.good {
    background: var(--good);
  }

  .progress>i.warn {
    background: var(--warning);
  }

  .progress>i.serious {
    background: var(--serious);
  }

  .progress>i.crit {
    background: var(--critical);
  }

  .kpi {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 14px 15px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    box-shadow: var(--shadow-1);
  }

  .kpi .lbl {
    font-size: 11.5px;
    color: var(--ink-2);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .kpi .val {
    font-family: var(--display);
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -.028em;
    line-height: 1.1;
  }

  .kpi .val small {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-3);
    margin-left: 2px;
  }

  .kpi .meta {
    font-size: 11.5px;
    color: var(--ink-3);
  }

  .kpi.accent {
    border-left: 3px solid var(--brand);
  }

  table.tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  table.tbl th {
    text-align: left;
    font-size: 10.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
    white-space: nowrap;
    position: sticky;
    top: 0;
  }

  table.tbl td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--line-2);
    vertical-align: middle;
  }

  table.tbl tbody tr:hover {
    background: var(--surface-2);
  }

  table.tbl td.num,
  table.tbl th.num {
    text-align: right;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  table.tbl tr.clickable {
    cursor: pointer;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field>label {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .field>label .req {
    color: var(--critical);
  }

  .inp {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    font-size: 13.5px;
    transition: border-color .12s, box-shadow .12s;
  }

  .inp:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
  }

  textarea.inp {
    min-height: 78px;
    resize: vertical;
    line-height: 1.55;
  }

  select.inp {
    cursor: pointer;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
    background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 30px;
  }

  .hint {
    font-size: 11.5px;
    color: var(--ink-3);
  }

  .check {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    cursor: pointer;
    font-size: 13px;
    padding: 7px 9px;
    border-radius: var(--r-md);
    border: 1px solid var(--line);
    background: var(--surface);
  }

  .check:hover {
    background: var(--surface-2);
  }

  .check.on {
    border-color: var(--brand);
    background: var(--brand-soft);
  }

  .check input {
    margin-top: 2px;
    accent-color: var(--brand);
  }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(9, 16, 14, .5);
    backdrop-filter: blur(3px);
    z-index: 200;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    animation: fade .16s ease;
  }

  .modal {
    background: var(--surface);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-2);
    width: 100%;
    max-width: 640px;
    border: 1px solid var(--line);
    animation: pop .18s cubic-bezier(.2, .8, .3, 1);
  }

  .modal.wide {
    max-width: 940px;
  }

  .modal.xwide {
    max-width: 1180px;
  }

  .modal-h {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line-2);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-h h3 {
    font-size: 15.5px;
  }

  .modal-b {
    padding: 18px;
  }

  .modal-f {
    padding: 14px 18px;
    border-top: 1px solid var(--line-2);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    background: var(--surface-2);
    border-radius: 0 0 var(--r-xl) var(--r-xl);
  }

  @keyframes fade {
    from {
      opacity: 0
    }
  }

  @keyframes pop {
    from {
      opacity: 0;
      transform: translateY(-8px) scale(.99)
    }
  }

  .tabs {
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }

  .tabs button {
    background: none;
    border: 0;
    padding: 9px 13px;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
  }

  .tabs button:hover {
    color: var(--ink);
  }

  .tabs button.on {
    color: var(--brand);
    border-bottom-color: var(--brand);
    font-weight: 500;
  }

  .empty {
    text-align: center;
    padding: 38px 20px;
    color: var(--ink-3);
  }

  .empty h4 {
    font-size: 14px;
    color: var(--ink-2);
    margin-bottom: 4px;
  }

  .toastwrap {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 400;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  .toast {
    background: var(--sidebar);
    color: #fff;
    padding: 10px 14px;
    border-radius: var(--r-md);
    box-shadow: var(--shadow-2);
    font-size: 13px;
    display: flex;
    gap: 9px;
    align-items: center;
    animation: slidein .2s ease;
    max-width: 380px;
  }

  .toast .ico {
    flex: none;
  }

  .toast.ok .ico {
    color: #5fe05f;
  }

  .toast.err .ico {
    color: #ff8a8a;
  }

  @keyframes slidein {
    from {
      opacity: 0;
      transform: translateX(20px)
    }
  }

  /* ---------- wizard ---------- */
  .wizwrap {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 18px;
    align-items: start;
  }

  .steprail {
    position: sticky;
    top: 74px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 8px;
    box-shadow: var(--shadow-1);
  }

  .steprail .st {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 8px 9px;
    border-radius: var(--r-md);
    cursor: pointer;
    border: 0;
    background: none;
    width: 100%;
    text-align: left;
  }

  .steprail .st:hover {
    background: var(--surface-2);
  }

  .steprail .st.on {
    background: var(--brand-soft);
  }

  .steprail .st .n {
    width: 21px;
    height: 21px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: grid;
    place-items: center;
    font-size: 10.5px;
    font-family: var(--mono);
    flex: none;
    color: var(--ink-3);
    margin-top: 1px;
  }

  .steprail .st.on .n {
    border-color: var(--brand);
    background: var(--brand);
    color: #fff;
  }

  .steprail .st.done .n {
    border-color: var(--good);
    background: var(--good);
    color: #fff;
  }

  .steprail .st .t {
    font-size: 12.5px;
    line-height: 1.3;
  }

  .steprail .st.on .t {
    font-weight: 600;
    color: var(--brand-ink);
  }

  .steprail .st .s {
    font-size: 10.5px;
    color: var(--ink-3);
  }

  .wizbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line-2);
  }

  .wizfoot {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 14px 16px;
    border-top: 1px solid var(--line-2);
    background: var(--surface-2);
    border-radius: 0 0 var(--r-lg) var(--r-lg);
  }

  .autosave {
    font-size: 11.5px;
    color: var(--good-ink);
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
  }

  /* ---------- content blocks ---------- */
  .blk {
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
  }

  .blk-h {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--line-2);
    background: var(--surface-2);
    border-radius: var(--r-md) var(--r-md) 0 0;
  }

  .blk-h .ty {
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  .blk-b {
    padding: 10px;
  }

  .blockpicker {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 6px;
  }

  .blockpicker button {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-start;
    padding: 9px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    cursor: pointer;
    font-size: 12px;
  }

  .blockpicker button:hover {
    border-color: var(--brand);
    background: var(--brand-soft);
  }

  /* participant reading view */
  .reader {
    font-size: 15px;
    line-height: 1.72;
    color: var(--ink);
  }

  .reader h2 {
    font-size: 20px;
    margin: 4px 0 8px;
  }

  .reader h3 {
    font-size: 16.5px;
    margin: 20px 0 6px;
  }

  .reader p {
    margin: 0 0 12px;
    max-width: 70ch;
  }

  .reader ol,
  .reader ul {
    max-width: 70ch;
    padding-left: 20px;
    margin: 0 0 12px;
  }

  .reader li {
    margin-bottom: 5px;
  }

  .reader blockquote {
    margin: 0 0 14px;
    padding: 10px 16px;
    border-left: 3px solid var(--brand);
    background: var(--brand-soft);
    border-radius: 0 var(--r-md) var(--r-md) 0;
    font-style: italic;
    color: var(--brand-ink);
    max-width: 70ch;
  }

  .reader pre {
    background: var(--sidebar);
    color: #d5e6df;
    padding: 13px 15px;
    border-radius: var(--r-md);
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    margin: 0 0 14px;
  }

  .reader table {
    border-collapse: collapse;
    font-size: 13.5px;
    margin: 0 0 14px;
    width: 100%;
  }

  .reader table th {
    background: var(--surface-2);
    text-align: left;
    padding: 8px 11px;
    border: 1px solid var(--line);
    font-weight: 600;
    font-size: 12.5px;
  }

  .reader table td {
    padding: 8px 11px;
    border: 1px solid var(--line);
  }

  .reader figure {
    margin: 0 0 14px;
  }

  .reader figcaption {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 5px;
  }

  .callout {
    border: 1px solid var(--line);
    border-left: 3px solid var(--brass);
    background: var(--brass-soft);
    padding: 12px 14px;
    border-radius: 0 var(--r-md) var(--r-md) 0;
    margin: 0 0 14px;
    max-width: 70ch;
  }

  /* journey rail */
  .journey {
    display: flex;
    gap: 0;
    overflow-x: auto;
    padding: 2px;
  }

  .journey .node {
    flex: 1;
    min-width: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 4px;
    border: 0;
    background: none;
    cursor: pointer;
    position: relative;
    border-radius: var(--r-md);
  }

  .journey .node:hover {
    background: var(--surface-2);
  }

  .journey .node .ring {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display: grid;
    place-items: center;
    background: var(--surface);
    font-size: 11px;
    font-family: var(--mono);
    color: var(--ink-3);
    z-index: 2;
  }

  .journey .node.done .ring {
    border-color: var(--good);
    background: var(--good);
    color: #fff;
  }

  .journey .node.cur .ring {
    border-color: var(--brand);
    background: var(--brand);
    color: #fff;
    box-shadow: 0 0 0 4px var(--brand-soft);
  }

  .journey .node .lb {
    font-size: 11px;
    text-align: center;
    color: var(--ink-2);
    line-height: 1.25;
  }

  .journey .node.cur .lb {
    color: var(--brand-ink);
    font-weight: 600;
  }

  .journey .node::after {
    content: "";
    position: absolute;
    top: 25px;
    left: 50%;
    right: -50%;
    height: 2px;
    background: var(--line);
    z-index: 1;
  }

  .journey .node:last-child::after {
    display: none;
  }

  .journey .node.done::after {
    background: var(--good);
  }

  /* question / test */
  .qcard {
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface);
    padding: 16px;
  }

  .opt {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    cursor: pointer;
    margin-bottom: 7px;
    background: var(--surface);
    transition: border-color .12s, background .12s;
  }

  .opt:hover {
    border-color: var(--brand);
  }

  .opt.sel {
    border-color: var(--brand);
    background: var(--brand-soft);
  }

  .opt.correct {
    border-color: var(--good);
    background: var(--good-soft);
  }

  .opt.wrong {
    border-color: var(--critical);
    background: var(--crit-soft);
  }

  .opt .key {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: grid;
    place-items: center;
    font-size: 11px;
    font-family: var(--mono);
    flex: none;
  }

  .opt.sel .key {
    border-color: var(--brand);
    background: var(--brand);
    color: #fff;
  }

  .opt.correct .key {
    border-color: var(--good);
    background: var(--good);
    color: #fff;
  }

  .opt.wrong .key {
    border-color: var(--critical);
    background: var(--critical);
    color: #fff;
  }

  .qnav {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
    gap: 5px;
  }

  .qnav button {
    aspect-ratio: 1;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    font-size: 11.5px;
    font-family: var(--mono);
    cursor: pointer;
  }

  .qnav button.answered {
    background: var(--brand-soft);
    border-color: var(--brand);
    color: var(--brand-ink);
  }

  .qnav button.cur {
    outline: 2px solid var(--brand);
    outline-offset: 1px;
  }

  .timer {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--r-md);
    background: var(--surface-3);
  }

  .timer.low {
    background: var(--crit-soft);
    color: var(--crit-ink);
  }

  /* login */
  .loginwrap {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    background: var(--ground);
  }

  .loginart {
    background: var(--sidebar);
    color: #fff;
    padding: 46px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .loginart .mesh {
    position: absolute;
    inset: 0;
    opacity: .5;
    background:
      radial-gradient(680px 420px at 15% 12%, rgba(47, 167, 141, .32), transparent 62%),
      radial-gradient(520px 380px at 88% 78%, rgba(208, 160, 63, .16), transparent 60%);
  }

  .loginart>* {
    position: relative;
  }

  .loginform {
    display: grid;
    place-items: center;
    padding: 40px 32px;
  }

  .loginform .box {
    width: 100%;
    max-width: 400px;
  }

  .rolecard {
    display: flex;
    gap: 11px;
    align-items: center;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    cursor: pointer;
    width: 100%;
    text-align: left;
    margin-bottom: 7px;
    transition: border-color .12s, background .12s;
  }

  .rolecard:hover {
    border-color: var(--brand);
    background: var(--brand-soft);
  }

  .rolecard.on {
    border-color: var(--brand);
    background: var(--brand-soft);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
  }

  .rolecard .av {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    flex: none;
  }

  /* charts */
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 12px;
    color: var(--ink-2);
  }

  .chart-legend .k {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .chart-legend .sw {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex: none;
  }

  .tipbox {
    position: fixed;
    z-index: 500;
    pointer-events: none;
    background: var(--sidebar);
    color: #fff;
    padding: 7px 10px;
    border-radius: var(--r-sm);
    font-size: 12px;
    box-shadow: var(--shadow-2);
    line-height: 1.45;
  }

  .tipbox .tk {
    color: #9fbdb2;
  }

  .hbar {
    display: grid;
    grid-template-columns: minmax(90px, 190px) 1fr 60px;
    gap: 10px;
    align-items: center;
    font-size: 12.5px;
  }

  .hbar+.hbar {
    margin-top: 9px;
  }

  .hbar .track {
    height: 16px;
    background: var(--surface-3);
    border-radius: 4px;
    overflow: hidden;
  }

  .hbar .fill {
    height: 100%;
    border-radius: 0 4px 4px 0;
    transition: width .5s cubic-bezier(.2, .7, .3, 1);
  }

  .hbar .v {
    text-align: right;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .notif {
    display: flex;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line-2);
    align-items: flex-start;
  }

  .notif:last-child {
    border-bottom: 0;
  }

  .notif.unread {
    background: var(--brand-soft);
  }

  .notif .nb {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--brand);
    margin-top: 6px;
    flex: none;
  }

  .notifpanel {
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    width: 340px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    z-index: 60;
    max-height: 420px;
    overflow-y: auto;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--surface-3);
    font-size: 11.5px;
    color: var(--ink-2);
  }

  .chip button {
    border: 0;
    background: none;
    cursor: pointer;
    padding: 0;
    color: var(--ink-3);
    display: grid;
  }

  .deflist {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
    font-size: 13px;
  }

  .deflist dt {
    color: var(--ink-3);
    font-size: 12px;
  }

  .deflist dd {
    margin: 0;
  }

  .cert {
    border: 2px solid var(--brass);
    border-radius: var(--r-lg);
    padding: 30px;
    text-align: center;
    background: linear-gradient(180deg, var(--brass-soft), var(--surface) 70%);
    position: relative;
  }

  .cert .seal {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--brass);
    color: #fff;
    display: grid;
    place-items: center;
    margin: 0 auto 12px;
    font-family: var(--display);
    font-weight: 700;
  }

  .rating {
    display: flex;
    gap: 5px;
  }

  .rating button {
    width: 34px;
    height: 34px;
    border-radius: var(--r-sm);
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12.5px;
  }

  .rating button.on {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  .npsscale {
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    gap: 5px;
  }

  .npsscale button {
    aspect-ratio: 1;
    border-radius: var(--r-sm);
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 13px;
  }

  .npsscale button:hover {
    border-color: var(--brand);
  }

  .npsscale button.on {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
    font-weight: 600;
  }

  .filterbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: flex-end;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    margin-bottom: 14px;
  }

  .filterbar .field {
    min-width: 140px;
  }

  .filterbar .inp {
    padding: 6px 9px;
    font-size: 12.5px;
  }

  .mobilebar {
    display: none;
  }

  @media (max-width: 1000px) {
    .app {
      grid-template-columns: 1fr;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 260px;
      z-index: 150;
      transform: translateX(-100%);
      transition: transform .2s ease;
    }

    .sidebar.open {
      transform: none;
      box-shadow: var(--shadow-2);
    }

    .mobilebar {
      display: inline-flex;
    }

    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(9, 16, 14, .45);
      z-index: 140;
    }

    .wizwrap {
      grid-template-columns: 1fr;
    }

    .steprail {
      position: static;
    }

    .loginwrap {
      grid-template-columns: 1fr;
    }

    .loginart {
      display: none;
    }

    .content {
      padding: 18px 14px 60px;
    }

    .topbar {
      padding: 10px 14px;
    }
  }

  @media print {

    .sidebar,
    .topbar,
    .no-print {
      display: none !important;
    }

    .app {
      grid-template-columns: 1fr;
    }

    .card {
      break-inside: avoid;
      box-shadow: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>

<script>
  if (typeof React === "undefined" || typeof ReactDOM === "undefined") {
    document.getElementById("root").innerHTML =
      '<div style="padding:56px 24px;text-align:center;font-family:system-ui,sans-serif;color:#4e625a">' +
      '<h2 style="margin:0 0 8px;color:#101815;font-size:18px">Pustaka tampilan gagal dimuat</h2>' +
      '<p style="margin:0;font-size:14px">Koneksi ke CDN terputus. Muat ulang halaman untuk mencoba lagi.</p></div>';
  } else {
    /* ============================================================================
       AKADEMI LEARNING WORKSPACE
       End-to-End Learning Module Preparation, Delivery & Monitoring Platform
       ---------------------------------------------------------------------------
       ARSITEKTUR
       1. StorageAdapter  -> antarmuka penyimpanan (localStorage saat ini,
                             RestAdapter tinggal di-swap saat backend siap)
       2. db              -> repository generik (list/get/insert/update/remove)
       3. svc             -> domain service (business rule: readiness, scoring,
                             analytics, workflow) — tidak tahu soal penyimpanan
       4. UI (React)      -> hanya memanggil svc, tidak pernah menyentuh storage
       ========================================================================== */
    const {
      useState,
      useEffect,
      useMemo,
      useRef,
      useCallback,
      Fragment
    } = React;

    /* ---------------------------------------------------------------- storage */
    /* ==========================================================================
       LAPISAN DATA — SEMUA DATA NYATA DARI GOOGLE APPS SCRIPT
       --------------------------------------------------------------------------
       api    -> pemanggil endpoint Apps Script (Sheets + Drive)
       store  -> cermin data di memori (agar UI tetap responsif)
       sync   -> antrian operasi tulis (insert/update/delete) ke backend
       db     -> repository generik yang dipakai seluruh aplikasi
       Tidak ada satu pun data contoh/dummy di berkas ini.
       ========================================================================== */

    /* URL deployment Apps Script (/exec). Dapat ditimpa per browser lewat layar
       "Koneksi Backend" tanpa mengedit berkas ini. */
    const API_DEFAULT_URL = "https://script.google.com/macros/s/AKfycbyHrafpysz_2hnFPO7NBYFLZetkNB9KpjY4N-X-7cWiHKLvXaLNdp2z0-Bw8STBfQOF/exec";

    const CFG_KEY = "akademi.backend.v2";
    const CACHE_KEY = "akademi.cache.v2";
    const QUEUE_KEY = "akademi.queue.v2";
    const SESSION_KEY = "akademi.session.v2";

    /* Sheet yang benar-benar dipakai aplikasi ramping ini (19, dari sebelumnya 27).
       employees digabung ke users; roles, notifications, audit_logs,
       module_versions, module_reviews, submission_reviews, dan templates
       dihapus agar backend cukup membaca sedikit sheet setiap kali load. */
    const COLLECTIONS = ["users", "programs", "classes", "class_participants", "modules", "module_files", "learning_objectives", "questions", "assessments", "assessment_attempts", "assessment_answers", "content_sections", "activities", "assignments", "submissions", "attendance", "nps_responses", "journey", "settings"];
    const FILE_CATEGORIES = [{
      key: "MATERIAL",
      label: "Materi",
      folder: "01_MATERIAL",
      accept: ".pdf,.doc,.docx,.txt,.md"
    }, {
      key: "PRESENTATION",
      label: "Presentasi",
      folder: "02_PRESENTATION",
      accept: ".ppt,.pptx,.pdf,.key"
    }, {
      key: "DATASET",
      label: "Dataset",
      folder: "03_DATASET",
      accept: ".xlsx,.xls,.csv,.json"
    }, {
      key: "EXERCISE",
      label: "Latihan",
      folder: "04_EXERCISE",
      accept: ".xlsx,.xls,.csv,.pdf,.docx"
    }, {
      key: "TEMPLATE",
      label: "Template",
      folder: "05_TEMPLATE",
      accept: ".xlsx,.pptx,.docx"
    }, {
      key: "VIDEO",
      label: "Video",
      folder: "06_VIDEO",
      accept: ".mp4,.mov,.webm,.m4v"
    }, {
      key: "IMAGE",
      label: "Gambar",
      folder: "07_IMAGE",
      accept: ".png,.jpg,.jpeg,.svg,.webp"
    }, {
      key: "OTHER",
      label: "Lainnya",
      folder: "08_OTHER",
      accept: ""
    }];

    const lsGet = (k, fb) => {
      try {
        const raw = window.localStorage.getItem(k);
        return raw ? JSON.parse(raw) : fb;
      } catch (e) {
        return fb;
      }
    };
    const lsSet = (k, v) => {
      try {
        window.localStorage.setItem(k, JSON.stringify(v));
        return true;
      } catch (e) {
        return false;
      }
    };
    const lsDel = k => {
      try {
        window.localStorage.removeItem(k);
      } catch (e) { }
    };

    /* ------------------------------------------------------------- konfigurasi */
    const cfg = Object.assign({
      url: API_DEFAULT_URL,
      key: ""
    }, lsGet(CFG_KEY, {}) || {});

    function saveConfig(next) {
      Object.assign(cfg, next || {});
      lsSet(CFG_KEY, {
        url: cfg.url,
        key: cfg.key
      });
    }

    /* ------------------------------------------------------------------ sesi */
    const session = {
      token: "",
      user: null
    };
